# Sakshi Workflow Feature Implementation With Docs And Tests

## Action

Follow the feature-implementation-with-docs-and-tests workflow:
1. Update or create implementation code in sakshi/ (e.g., sakshi/recovery/hinting.py)
2. Update or create corresponding __init__.py files if needed
3. Update or create documentation in docs/api/ and docs/architecture.md
4. Update CHANGELOG.md
5. Update mkdocs.yml if new docs are added
6. Update or create tests in tests/unit/
7. Update pyproject.toml or uv.lock if dependencies change

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: sakshi/**/*.py, docs/api/*.md, docs/architecture.md

