[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysakshi"
version = "0.12.0"
description = "A metacognitive runtime for Python agents: the Witness pattern."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dr. Mani Saint-Victor" }]
maintainers = [{ name = "Dr. Mani Saint-Victor" }]
keywords = [
    "metacognition",
    "cognitive-architecture",
    "agents",
    "active-inference",
    "monitor-assess-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/bionicbutterfly13/sakshi"
Documentation = "https://bionicbutterfly13.github.io/sakshi/"
Source = "https://github.com/bionicbutterfly13/sakshi"
Issues = "https://github.com/bionicbutterfly13/sakshi/issues"
Changelog = "https://github.com/bionicbutterfly13/sakshi/blob/main/CHANGELOG.md"
Provenance = "https://github.com/bionicbutterfly13/sakshi/blob/main/INSPIRATION.md"

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
llm-examples = [
    "anthropic>=0.40",
]

[tool.setuptools]
packages = [
    "sakshi",
    "sakshi.models",
    "sakshi.cycle",
    "sakshi.goals",
    "sakshi.plans",
    "sakshi.meta",
    "sakshi.interpret",
    "sakshi.registries",
    "sakshi.intake",
    "sakshi.world",
]

[tool.setuptools.package-data]
sakshi = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
# Benchmarks live under tests/benchmarks/ and are run with `make benchmark`.
